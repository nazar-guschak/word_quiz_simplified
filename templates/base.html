{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%}Словник{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'quiz/css/styles.css' %}">
    {% block css %}{% endblock %}
</head>

<body>
    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
            <div class="message message-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <header>
        <nav>
            <a href="{% url 'quiz:index' %}">Головна</a>
            <a href="{% url 'quiz:quiz' %}">Тест</a>

            {% if user.is_authenticated %}
                <form method="post" action="{% url 'users:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Вихід</button>
                </form>
            {% else %}
                <a href="{% url 'users:login' %}">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // --- Message Handling ---
    const messages = document.querySelectorAll(".message");

    messages.forEach(msg => {
        setTimeout(() => {
            // Set transition first or ensure it's in CSS
            msg.style.transition = "all 0.5s ease";
            msg.style.opacity = "0";
            msg.style.transform = "translateY(-10px)";

            // Remove from DOM after transition finishes
            setTimeout(() => msg.remove(), 500);
        }, 3000);
    });

    // --- Dialog Handling ---
    const sortDialog = document.getElementById('sortDialog');

    // Check if it exists to prevent errors
    if (sortDialog) {
        sortDialog.addEventListener('click', e => {
            if (e.target === sortDialog) {
                sortDialog.close();
            }
        });
    }
});
</script>
</html>
