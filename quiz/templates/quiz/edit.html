{% extends "base.html" %}

{% block title %}Редагувати - Словник{% endblock %}

{% block content %}

<div>
    <form method="post" class="add-form">
        {% csrf_token %}
        <h2>Редагувати</h2>
        <div class="edit-word">
            {{ form.word }}
            <span><i class="bi bi-chevron-right"></i></span>
            {{ form.translation }}
        </div>
        <button type="submit" class="button">Зберегти</button>
    </form>
</div>

{% endblock %}
