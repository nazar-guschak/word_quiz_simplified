{% extends "base.html" %}

{% block title %}Тест - Словник{% endblock %}

{% block content %}

<div class="quiz-container">
    <h2>Результати: {{ correct_answers }} з 10</h2>
    <br>
    {% for r in results %}
    <div class="question">
        <h2>{{ r.word }}</h2>
        <ul class="results-list">
            {% for option in r.options %}
            <li class="{% if option == r.correct %}result correct{% elif option == r.selected %}result wrong{% else %}result{% endif %}">{{ option }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}
    <div class="restart-buttons">
        <a href="{% url 'quiz:index' %}" class="button">Головна</a>
        <a href="{% url 'quiz:quiz' %}" class="button">Новий тест</a>
    </div>
</div>

{% endblock %}
